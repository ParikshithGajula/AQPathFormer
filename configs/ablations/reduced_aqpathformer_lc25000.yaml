# Ablation G: Reduced AQPathFormer - EXP070

experiment:
  name: "reduced_aqpathformer_lc25000"
  seed: 42

dataset:
  name: "lc25000"
  root_dir: "data/lc25000"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  split_strategy: "random"
  num_workers: 4
  pin_memory: false

preprocessing:
  image_size: 224
  patch_size: 16
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: true
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotation: 90
    color_jitter: 0.1
    gaussian_blur: 0.1

model:
  name: "aqpathformer_reduced"
  embed_dim: 768
  num_classes: 5
  num_heads: 8
  dropout: 0.1
  use_adaptive_patches: false
  use_quantum_encoder: false
  use_adaptive_attention: false
  use_multiscale: false
  use_cross_cancer: false
  patch_generator:
    type: "fixed"
  classical_encoder: {'output_dim': 16, 'classical_backbone': 'resnet18'}
  attention:
    type: "standard"
    num_heads: 8
  multiscale_fusion:
    type: "single"
    projection_dim: 4
  decoder:
    type: "hybrid"
    num_layers: 2
  head: {'dataset_configs': {'lc25000': {'num_classes': 5}}}

training:
  batch_size: 8
  epochs: 20
  optimizer:
    name: "adamw"
    lr: 1e-4
    weight_decay: 1e-4
  scheduler:
    name: "cosine_annealing_warmup"
    warmup_epochs: 2
    min_lr: 1e-6

quantum:
  enabled: false