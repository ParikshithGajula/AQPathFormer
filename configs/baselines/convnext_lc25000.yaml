# ConvNeXt Baseline Configuration for LC25000

_base_: "../../base.yaml"

experiment:
  name: "convnext_lc25000"
  seed: 42

model:
  name: "convnext"
  num_classes: 5
  pretrained: true
  dropout: 0.1

training:
  batch_size: 8
  epochs: 20
  optimizer:
    name: "adamw"
    lr: 1e-3
    weight_decay: 1e-4
  scheduler:
    name: "cosine_annealing_warmup"
    warmup_epochs: 2
    min_lr: 1e-6

quantum:
  enabled: false