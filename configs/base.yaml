# Base Configuration for AQPathFormer Experiments

# Experiment settings
experiment:
  name: "base_experiment"
  seed: 42
  device: "cpu"  # "cuda" if available
  mixed_precision: false
  gradient_accumulation_steps: 4
  log_interval: 10
  eval_interval: 1
  save_interval: 5

# Dataset settings
dataset:
  name: "lc25000"
  root_dir: "data/lc25000"
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  split_strategy: "patient_level"  # or "random"
  num_workers: 4
  pin_memory: false

# Preprocessing settings
preprocessing:
  image_size: 224
  patch_size: 16
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    enabled: true
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotation: 90
    color_jitter: 0.1
    gaussian_blur: 0.1

# Training settings
training:
  batch_size: 8
  epochs: 20
  optimizer:
    name: "adamw"
    lr: 1e-4
    weight_decay: 1e-4
    betas: [0.9, 0.999]
  scheduler:
    name: "cosine_annealing_warmup"
    warmup_epochs: 2
    min_lr: 1e-6
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 1e-4

# Model settings (to be overridden by specific configs)
model:
  name: "base"
  num_classes: 5
  dropout: 0.1

# Quantum settings (for quantum models)
quantum:
  enabled: false
  num_qubits: 4
  circuit_depth: 2
  feature_map: "angle_embedding"
  ansatz: "strongly_entangling_layers"
  shots: 1000
  noise:
    enabled: false
    depolarizing_rate: 0.01
    amplitude_damping_rate: 0.01

# Evaluation settings
evaluation:
  metrics:
    - "accuracy"
    - "precision_macro"
    - "recall_macro"
    - "f1_macro"
    - "roc_auc_ovr"
    - "pr_auc"
    - "mcc"
    - "specificity_per_class"
  compute_flops: true
  compute_params: true
  compute_inference_time: true
  save_predictions: true
  save_confusion_matrix: true

# Logging settings
logging:
  wandb:
    enabled: false
    project: "aqpathformer"
    entity: null
  local:
    enabled: true
    log_dir: "experiments"